<section class="srh-sec">
  <div class="srh-sec__inner" style="max-width:920px;margin-inline:auto;text-align:center;">
    {% if module.eyebrow %}<div class="srh-eyebrow">{{ module.eyebrow }}</div>{% endif %}
    {% if module.heading %}<h2 class="srh-h2">{{ module.heading }}</h2>{% endif %}
    <div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;margin-top:1.5rem;">
      {% if module.video_url %}
        <iframe src="{{ module.video_url }}" title="{{ module.heading|default('Video', true) }}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
      {% else %}
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,20,18,0.55);">
          <svg viewBox="0 0 24 24" class="mono" width="72" height="72" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
            <path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor"></path>
          </svg>
        </div>
      {% endif %}
    </div>
    {% if module.caption %}<p class="srh-lead" style="margin-inline:auto;margin-top:1rem;">{{ module.caption }}</p>{% endif %}
  </div>
</section>
