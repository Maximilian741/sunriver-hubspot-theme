<section class="srh-band srh-band--rev srh-cta" style="padding-top:14px;padding-bottom:14px;">
  <canvas class="srh-band__canvas" data-srx-shader="smoke-veil" aria-hidden="true"></canvas>
  <div class="srh-band__inner" style="text-align:center;max-width:920px;">
    {% if module.bar_text %}<span class="srh-lead" style="margin:0;display:inline;">{{ module.bar_text }}</span>{% endif %}
    {% if module.link_text and module.link_url.href %} <a class="srh-btn srh-btn--light" href="{{ module.link_url.href }}" style="margin-left:14px;">{{ module.link_text }} &rarr;</a>{% endif %}
  </div>
</section>
