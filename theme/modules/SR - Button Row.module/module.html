<section class="srh-band">
  <canvas class="srh-band__canvas" data-srx-shader="smoke-veil" aria-hidden="true"></canvas>
  <div class="srh-band__inner" style="text-align:center;max-width:920px;">
    {% if module.row_heading %}<p class="srh-eyebrow">{{ module.row_heading }}</p>{% endif %}
    <div class="srh-hero__ctas">
      {% for btn in module.buttons %}
        {% if btn.btn_text %}
          <a class="srh-btn srh-btn--{{ btn.btn_style }}" href="{{ btn.btn_url.href }}">{{ btn.btn_text }}</a>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</section>
