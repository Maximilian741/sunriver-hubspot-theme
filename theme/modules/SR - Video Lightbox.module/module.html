<![CDATA[{# SR Video Lightbox. Poster + play button opens a modal with an embedded video iframe. Self-inits via module.js (all .sr-vlightbox on the page). Drop into a page whose dnd_area is wrapped in .srh. #}
<section class="srh-sec">
  <div class="srh-sec__inner" style="max-width:920px;">
    {% if module.eyebrow or module.heading or module.lead %}
    <div style="text-align:center;margin-bottom:1.6rem;">
      {% if module.eyebrow %}<span class="srh-eyebrow" style="color:var(--river);">{{ module.eyebrow }}</span>{% endif %}
      {% if module.heading %}<h2 class="srh-h2">{{ module.heading }}</h2>{% endif %}
      {% if module.lead %}<div class="srh-lead">{{ module.lead }}</div>{% endif %}
    </div>
    {% endif %}

    <div class="sr-vlightbox" data-embed="{{ module.embed_url }}" data-title="{{ module.video_title }}">
      <button class="sr-vlightbox__trigger" type="button" aria-haspopup="dialog" aria-label="{{ module.play_label }}">
        {% if module.poster.src %}
          <img class="sr-vlightbox__poster" src="{{ module.poster.src }}" alt="{{ module.poster.alt }}" loading="lazy">
        {% else %}
          <span class="sr-vlightbox__poster sr-vlightbox__poster--blank" aria-hidden="true"></span>
        {% endif %}
        <span class="sr-vlightbox__veil" aria-hidden="true"></span>
        <span class="sr-vlightbox__play" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" focusable="false" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.78-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z" fill="currentColor"/></svg>
        </span>
        {% if module.play_label or module.video_length %}
        <span class="sr-vlightbox__cap" aria-hidden="true">
          {% if module.play_label %}<span class="sr-vlightbox__cap-text">{{ module.play_label }}</span>{% endif %}
          {% if module.video_length %}<span class="sr-vlightbox__cap-time">{{ module.video_length }}</span>{% endif %}
        </span>
        {% endif %}
      </button>

      <div class="sr-vlightbox__modal" role="dialog" aria-modal="true" aria-label="{{ module.video_title }}" hidden>
        <div class="sr-vlightbox__backdrop" data-close></div>
        <div class="sr-vlightbox__dialog">
          <button class="sr-vlightbox__close" type="button" aria-label="Close video" data-close>
            <svg viewBox="0 0 24 24" width="22" height="22" focusable="false" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <div class="sr-vlightbox__frame">
            <iframe class="sr-vlightbox__iframe" src="" title="{{ module.video_title }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>]]>
