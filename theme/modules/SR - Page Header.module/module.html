{# SR Page Header, compact smoke band: eyebrow + h1 + one-line lead, centered. #}
<section class="srh-band">
  <canvas class="srh-band__canvas" data-srx-shader="smoke-veil" aria-hidden="true"></canvas>
  <div class="srh-band__inner" style="text-align:center;max-width:920px;">
    {% if module.eyebrow %}<div class="srh-eyebrow">{{ module.eyebrow }}</div>{% endif %}
    <h1 class="srh-h1">{{ module.heading }}</h1>
    {% if module.lead %}<p class="srh-lead" style="margin-inline:auto;">{{ module.lead }}</p>{% endif %}
  </div>
</section>
