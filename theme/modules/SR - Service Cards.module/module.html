<div class="sr-services sr-services--cols-{{ module.columns|default('3') }}">
  {% for card in module.cards %}
    <a class="sr-service-card" href="{{ card.link_url.url.href }}"
      {% if card.link_url.open_in_new_tab %}target="_blank" rel="noopener"{% endif %}>
      <div class="sr-service-card__inner">
        <div class="sr-service-card__icon" aria-hidden="true">{{ card.icon_text }}</div>
        {% if card.title %}
          <h3 class="sr-service-card__title">{{ card.title }}</h3>
        {% endif %}
        {% if card.description %}
          <div class="sr-service-card__desc">{{ card.description }}</div>
        {% endif %}
        {% if card.link_text %}
          <span class="sr-service-card__cta">
            {{ card.link_text }}
            <span class="sr-service-card__arrow">&rarr;</span>
          </span>
        {% endif %}
      </div>
    </a>
  {% endfor %}
</div>
