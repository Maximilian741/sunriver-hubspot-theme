<section class="srh-band">
  <canvas class="srh-band__canvas" data-srx-shader="smoke-veil" aria-hidden="true"></canvas>
  <div class="srh-band__inner" style="text-align:center;max-width:920px;">
    {% if module.show_head %}
      {% if module.eyebrow %}<p class="srh-eyebrow">{{ module.eyebrow }}</p>{% endif %}
      {% if module.heading %}<h2 class="srh-h2">{{ module.heading }}</h2>{% endif %}
    {% endif %}
    <div class="srh-stats" style="margin-top:2.4rem;">
      {% for it in module.tiles %}
        <div class="srh-stat">
          <div class="srh-stat__n">{{ it.stat_num }}</div>
          <div class="srh-stat__k">{{ it.stat_caption }}</div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
