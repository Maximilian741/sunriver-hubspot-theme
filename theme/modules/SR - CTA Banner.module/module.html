{# SR CTA Banner, reversed green gradient band + smoke (.srh). #}
<section class="srh-band srh-band--rev srh-cta">
  <canvas class="srh-band__canvas" data-srx-shader="smoke-veil" aria-hidden="true"></canvas>
  <div class="srh-band__inner" style="text-align:center;">
    {% if module.heading %}<h2 class="srh-h2">{{ module.heading }}</h2>{% endif %}
    {% if module.subheading %}<p class="srh-lead" style="margin-inline:auto;">{{ module.subheading }}</p>{% endif %}
    <div class="srh-hero__ctas" style="justify-content:center;">
      {% if module.cta_text %}<a class="srh-btn srh-btn--primary" href="{{ module.cta_url.href }}">{{ module.cta_text }}</a>{% endif %}
    </div>
  </div>
</section>
